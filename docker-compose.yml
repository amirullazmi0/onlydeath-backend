services:
  postgres:
    image: postgres:17-alpine
    container_name: onlydeath-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onlydeath
    ports:
      - '5432:5432'
    volumes:
      - onlydeath-pgdata:/var/lib/postgresql/data

volumes:
  onlydeath-pgdata:
